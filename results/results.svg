  <text x="775" y="426" font-size="12" font-weight="700" fill="#0b0b0b">0.778</text>

  <g font-size="12">
    <text x="830" y="122" fill="#8c8b85">기준</text>
    <text x="830" y="179" fill="#52514e">✕ 폐기</text>
    <text x="830" y="236" fill="#52514e">✓ 유지</text>
    <text x="830" y="293" fill="#52514e">✓ 유지</text>
    <text x="830" y="350" fill="#52514e">✕ Rewrite 폐기</text>
    <text x="830" y="413" font-weight="700" fill="#0b0b0b">★ 채택</text>
  </g>

  <text x="40" y="478" font-size="12" fill="#52514e">2번 — 조문 경계 분할은 단독 적용 시 역효과. 긴 조문의 의미 희석을 측정으로 확인하고 3번으로 교체</text>
  <text x="40" y="496" font-size="12" fill="#52514e">5번 — MRR은 최고치였으나 원 질의와 재작성 질의가 Top-4를 분할 점유해 Recall 하락. Rewrite만 제외하고 Route는 유지</text>
</svg>
