  <text x="40" y="283" font-size="13.5" fill="#0b0b0b">4. + Hybrid (BM25)</text>
  <text x="40" y="300" font-size="11.5" fill="#8c8b85">Dense 0.5 + BM25 0.5 · RRF</text>
  <path d="M300 275 H729.2 Q733.2 275 733.2 279 V287 Q733.2 291 729.2 291 H300 Z" fill="#2a78d6"/>
  <path d="M300 293 H718.4 Q722.4 293 722.4 297 V305 Q722.4 309 718.4 309 H300 Z" fill="#eb6834"/>
