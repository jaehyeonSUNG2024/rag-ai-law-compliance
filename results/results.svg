  <text x="40" y="129" font-size="11.5" fill="#8c8b85">글자수 Chunk 200 + Similarity</text>
  <path d="M300 104 H662.6 Q666.6 104 666.6 108 V116 Q666.6 120 662.6 120 H300 Z" fill="#2a78d6"/>
  <path d="M300 122 H679.4 Q683.4 122 683.4 126 V134 Q683.4 138 679.4 138 H300 Z" fill="#eb6834"/>
  <text x="675" y="116" font-size="12" fill="#52514e">0.611</text>
  <text x="692" y="134" font-size="12" fill="#52514e">0.639</text>

