  <text x="40" y="169" font-size="13.5" fill="#0b0b0b">2. + 조 단위 Chunk</text>
  <text x="40" y="186" font-size="11.5" fill="#8c8b85">조문 경계로 분할</text>
  <path d="M300 161 H629.6 Q633.6 161 633.6 165 V173 Q633.6 177 629.6 177 H300 Z" fill="#2a78d6"/>
  <path d="M300 179 H562.4 Q566.4 179 566.4 183 V191 Q566.4 195 562.4 195 H300 Z" fill="#eb6834"/>
  <text x="642" y="173" font-size="12" fill="#52514e">0.556 ↓</text>
  <text x="575" y="191" font-size="12" fill="#52514e">0.444 ↓</text>

  <!-- 3 ParentDocument -->
  <text x="40" y="226" font-size="13.5" fill="#0b0b0b">3. + ParentDocument</text>
  <text x="40" y="243" font-size="11.5" fill="#8c8b85">작은 조각 검색 → 조 전체 반환</text>
  <path d="M300 218 H662.6 Q666.6 218 666.6 222 V230 Q666.6 234 662.6 234 H300 Z" fill="#2a78d6"/>
  <path d="M300 236 H701.6 Q705.6 236 705.6 240 V248 Q705.6 252 701.6 252 H300 Z" fill="#eb6834"/>
  <text x="675" y="230" font-size="12" fill="#52514e">0.611</text>
  <text x="714" y="248" font-size="12" fill="#52514e">0.676</text>

