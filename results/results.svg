  <text x="40" y="70" font-size="13.5" fill="#52514e">고정 질문 9개 · Top-K 4 고정 · 정답 조항 라벨 기준</text>

  <g font-size="12.5">
    <rect x="700" y="33" width="11" height="11" rx="2" fill="#2a78d6"/>
    <text x="717" y="43" fill="#52514e">Recall@4</text>
    <rect x="800" y="33" width="11" height="11" rx="2" fill="#eb6834"/>
    <text x="817" y="43" fill="#52514e">MRR</text>
  </g>

  <g stroke="#e6e5e1" stroke-width="1">
