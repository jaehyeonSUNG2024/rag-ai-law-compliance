  <text x="40" y="340" font-size="13.5" fill="#0b0b0b">5. + Rewrite · Route</text>
  <text x="40" y="357" font-size="11.5" fill="#8c8b85">질의 재작성 + 조 번호 직접 조회</text>
  <path d="M300 332 H662.6 Q666.6 332 666.6 336 V344 Q666.6 348 662.6 348 H300 Z" fill="#2a78d6"/>
  <path d="M300 350 H762.8 Q766.8 350 766.8 354 V362 Q766.8 366 762.8 366 H300 Z" fill="#eb6834"/>
  <text x="675" y="344" font-size="12" fill="#52514e">0.611 ↓</text>
  <text x="775" y="362" font-size="12" fill="#52514e">0.778</text>

  <!-- 6 Final -->
  <rect x="32" y="386" width="916" height="44" rx="6" fill="#f0f5fb"/>
  <text x="40" y="404" font-size="13.5" font-weight="700" fill="#0b0b0b">6. Final — Hybrid + Route</text>
  <text x="40" y="421" font-size="11.5" fill="#52514e">Baseline 대비 Recall@4 +18% · MRR +22%</text>
  <path d="M300 396 H729.2 Q733.2 396 733.2 400 V408 Q733.2 412 729.2 412 H300 Z" fill="#2a78d6"/>
  <path d="M300 414 H762.8 Q766.8 414 766.8 418 V426 Q766.8 430 762.8 430 H300 Z" fill="#eb6834"/>
